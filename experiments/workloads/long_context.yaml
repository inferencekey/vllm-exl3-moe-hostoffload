# E12, long context (added 2026-10-07): does E8 hold near the 262,144-token context? The recipe's fp8 KV cache
# (4.25 GiB per GPU) holds 623,891 tokens (E8 serve.log), so unique prompts fit at most 4 at 128K and 2 at 256K;
# a cached shared prefix is stored once, so more users fit. One repetition: the session is budget-bound.
seed: 20261012
repetitions: 1
stop_ttft_p95_s: 900          # long prefills queue behind each other; only a runaway level should stop a sweep
stop_error_rate: 0.05
stop_min_errors: 2
scenarios:
  - name: prefill-long
    kind: prefill
    prompt: {corpus: code, template: raw, region: [0.0, 0.5]}
    lengths: [32768, 65536, 131072, 260000]
    requests: 3
  - name: decode-128k
    kind: decode
    prompt: {corpus: code, template: continue_prose, region: [0.0, 0.5]}
    prompt_tokens: 131072
    output_tokens: 512
    sampling: {temperature: 0.6, top_p: 0.95}
    arrivals: {mode: closed, levels: [1, 2, 4], requests_per_user: 1, min_requests: 2}
  - name: decode-256k
    kind: decode
    prompt: {corpus: code, template: continue_prose, region: [0.0, 0.5]}
    prompt_tokens: 258000
    output_tokens: 512
    sampling: {temperature: 0.6, top_p: 0.95}
    arrivals: {mode: closed, levels: [1, 2], requests_per_user: 1, min_requests: 2}
  - name: B-prefix-128k
    kind: chat
    prompt: {corpus: code, tokens: 131200, shared_prefix_tokens: 131072, template: qa_prefix, region: [0.0, 0.5]}
    output: {max_tokens: 256}
    sampling: {temperature: 0.6, top_p: 0.95}
    arrivals: {mode: closed, levels: [1, 2, 4, 8], requests_per_user: 2, min_requests: 4, stagger_s: 5}
  - name: B-prefix-256k
    kind: chat
    prompt: {corpus: code, tokens: 258128, shared_prefix_tokens: 258000, template: qa_prefix, region: [0.0, 0.5]}
    output: {max_tokens: 256}
    sampling: {temperature: 0.6, top_p: 0.95}
    arrivals: {mode: closed, levels: [1, 2, 4], requests_per_user: 2, min_requests: 4, stagger_s: 5}
