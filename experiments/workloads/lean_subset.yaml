# Lean plan, E3: one repetition per configuration, the same prompts for every configuration.
seed: 20261007
repetitions: 1
stop_ttft_p95_s: 120
stop_error_rate: 0.05
scenarios:
  - name: A-code-4k
    kind: chat
    prompt: {corpus: code, tokens: 4096, template: review, region: [0.0, 0.5]}
    output: {max_tokens: 256}
    sampling: {temperature: 0.6, top_p: 0.95}
    arrivals: {mode: closed, levels: [1, 8, 32], requests_per_user: 2, min_requests: 8, stagger_s: 5}
  - name: decode
    kind: decode
    prompt: {corpus: code, template: continue_prose, region: [0.0, 0.5]}
    prompt_tokens: 128
    output_tokens: 512
    sampling: {temperature: 0.6, top_p: 0.95}
    arrivals: {mode: closed, levels: [1, 8, 32], requests_per_user: 1, min_requests: 4}
