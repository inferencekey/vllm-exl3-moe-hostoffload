# Fixed benchmark subset for the factor sweeps (E3 to E7): the same prompts for every factor level.
seed: 20261007
repetitions: 3
stop_ttft_p95_s: 120
stop_error_rate: 0.05
scenarios:
  - name: A-code-4k
    kind: chat
    prompt: {corpus: code, tokens: 4096, template: review, region: [0.0, 0.5]}
    output: {max_tokens: 256}
    sampling: {temperature: 0.6, top_p: 0.95}
    arrivals: {mode: closed, levels: [1, 8, 32], requests_per_user: 4, min_requests: 16, stagger_s: 10}
  - name: P-prose-1k
    kind: chat
    prompt: {corpus: prose, tokens: 1024, template: continue_prose, region: [0.0, 0.5]}
    output: {max_tokens: 256}
    sampling: {temperature: 0.6, top_p: 0.95}
    arrivals: {mode: closed, levels: [1, 8, 32], requests_per_user: 4, min_requests: 16, stagger_s: 10}
  - name: prefill
    kind: prefill
    prompt: {corpus: code, template: raw, region: [0.0, 0.5]}
    lengths: [4096, 16384]
    requests: 5
  - name: decode
    kind: decode
    prompt: {corpus: code, template: continue_prose, region: [0.0, 0.5]}
    prompt_tokens: 128
    output_tokens: 512
    sampling: {temperature: 0.6, top_p: 0.95}
    arrivals: {mode: closed, levels: [1, 8, 32], requests_per_user: 2, min_requests: 8}
