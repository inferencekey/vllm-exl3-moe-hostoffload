# Controlled experiments. Source of truth for experiments/PLAN.md (generated by `make plan`), for the result folders
# under data/controlled/ and for the NOT RUN placeholders in the paper. Hours are wall-clock pod hours including
# boot (about 4 min warm, 8 min cold), weight download (about 2.5 min for 310 GB at the observed rate) and teardown,
# estimated from the exploratory runs; they are estimates, not measurements.
#
# Variants (stack/variants/*.env):
#   upstream        vLLM 36768d1 image, unpatched; original DeepSeek checkpoint
#   upstream-uva    the same with upstream vLLM's selective UVA weight offload
#                   (--offload-backend uva --cpu-offload-gb G --cpu-offload-params experts)
#   exl3-min        vLLM + 5 vLLM patches + vllm-exl3 d3cfd394 unpatched + ExLlamaV3; no host experts, stock kernels
#   exl3-uva        exl3-min + upstream vLLM's selective UVA offload of the EXL3 expert parameters (layer granularity)
#   exl3-offload    exl3-min + Diffbot's exl3-thor.patch, xmoe kernels and THOR_* hooks (the measured stack)
# Factors of exl3-offload: PLAN (host-expert plan), ENGRAM (int4 | fp8), OVERLAP_SMS (decode / prefill), SPEC (dspark | none)

pricing_file: experiments/pricing.yaml
contingency: 0.20

experiments:
  - id: E0
    title: Static weight accounting (safetensors headers, Hub metadata)
    status: done
    gpu: none
    hours: 0
    command: make static
    data: data/static/
    answers: where every checkpoint byte goes under each plan; what cannot fit in VRAM
    minimal: true

  - id: E1
    title: Reproducible build of every variant (image digests, pip freeze, build logs)
    gpu: cpu-build
    hours: 1.5
    command: make bench-E1
    data: data/controlled/E1-build/
    answers: the stack builds from pinned sources and patches; provenance of the binaries
    minimal: false

  - id: E2
    title: Feasibility boots on 2x RTX PRO 6000 (ablation a and b without offload)
    gpu: 2x-rtx-pro-6000
    hours: 1.5
    command: make bench-E2
    data: data/controlled/E2-feasibility/
    runs:
      - {variant: upstream, model: original, note: "all in VRAM; expected OOM at load (file bytes exceed VRAM)"}
      - {variant: upstream-uva, model: original, note: "UVA offload of experts, 75 GiB per GPU; boot, 1 request, NaN check"}
      - {variant: exl3-min, model: exl3-3bpw, note: "no host experts; expected OOM at load"}
      - {variant: exl3-offload, model: exl3-3bpw, plan: none, note: "patched stack with an empty plan; expected OOM"}
    answers: what was not possible before the offload patch on this hardware, with the exact failure
    minimal: true

  - id: E3
    title: Host-share sweep (ablation c, share of experts on host)
    table_title: "Host share as run (rung (c) of the ablation ladder): the gen30 plan against the union of the gen30 and agent30 cold sets on pod 1, and the gen30 subset repeated on pod 2 (variant gen30-session2), one repetition per point"
    gpu: 2x-rtx-pro-6000
    hours: 4.5
    command: make bench-E3
    data: data/controlled/E3-host-share/
    runs:
      - {variant: exl3-offload, step: profile, note: "routing counts on the calibration workload (EXL3_EXPERT_STATS, eager)"}
      - {variant: exl3-offload, plan: "profile-{25,30,40,50,60}", note: "plans from the counts; fixed benchmark subset x 3 reps"}
      - {variant: exl3-uva, offload_gib_per_gpu: "same host bytes as profile-30 and profile-50", note: "upstream mechanism, same subset"}
    answers: the marginal performance cost of moving experts to host memory; the smallest share that fits; how much
      Diffbot's per-expert split gains over upstream vLLM's own selective UVA offload at equal host bytes
    minimal: true
    minimal_hours: 2.0
    minimal_note: shares 30 and 50, plus exl3-uva at the profile-30 host bytes

  - id: E4
    title: Placement policy at a fixed 30 percent share
    gpu: 2x-rtx-pro-6000
    hours: 1.75
    command: make bench-E4
    data: data/controlled/E4-placement-policy/
    runs:
      - {variant: exl3-offload, plan: gen30}
      - {variant: exl3-offload, plan: agent30}
      - {variant: exl3-offload, plan: blend30}
      - {variant: exl3-offload, plan: random30, note: "seeded uniform random, same per-layer counts as gen30"}
      - {variant: exl3-offload, plan: profile-30, note: "our plan from E3 counts (disjoint calibration prompts)"}
    answers: how much of the result is due to profile-guided placement and how much it depends on the traffic
    minimal: false

  - id: E5
    title: Engram tables int4 vs FP8 in pinned host memory
    gpu: 2x-rtx-pro-6000
    hours: 1.0
    command: make bench-E5
    data: data/controlled/E5-engram/
    runs:
      - {variant: exl3-offload, engram: int4}
      - {variant: exl3-offload, engram: fp8, note: "needs 189 GiB pinned for Engram; feasibility check first (cgroup 351 GiB)"}
    answers: the host-memory and speed cost of the Engram format
    minimal: false

  - id: E6
    title: Side-stream SM budget for host experts
    gpu: 2x-rtx-pro-6000
    hours: 1.75
    command: make bench-E6
    data: data/controlled/E6-overlap-sms/
    runs:
      - {variant: exl3-offload, overlap_sms: "decode {16,32,64} at prefill 64"}
      - {variant: exl3-offload, overlap_sms: "prefill {32,96} at decode 32"}
    answers: sensitivity of decode and prefill to the overlap budget
    minimal: false

  - id: E7
    title: DSpark on vs off (ablation d)
    gpu: 2x-rtx-pro-6000
    hours: 2.5
    command: make bench-E7
    data: data/controlled/E7-dspark/
    runs:
      - {variant: exl3-offload, spec: dspark}
      - {variant: exl3-offload, spec: none}
    answers: how much of the decode speed is speculation, and its dependence on content (code vs prose)
    minimal: false

  - id: E8
    title: Main controlled benchmark of the measured stack (concurrency 1 to 64, 3 repetitions, PCIe)
    table_title: "Main benchmark of the measured stack as run (gen30 plan; scenarios A and B at N = 1 to 64, two repetitions in B and in A only at N = 1; prefill and decode probes, one repetition)"
    gpu: 2x-rtx-pro-6000
    hours: 4.0
    command: make bench-E8
    data: data/controlled/E8-main/
    runs:
      - {variant: exl3-offload, plan: gen30, spec: dspark, workload: experiments/workloads/main.yaml}
      - {variant: exl3-offload, step: reboots, note: "3 cold boots x key points N in {1, 8, 32} for across-boot variance"}
      - {variant: exl3-offload, step: nsys, note: "one nsys capture with GPU metrics (PCIe) at N = 8"}
    answers: TTFT, TPOT, E2E percentiles, throughput, memory split and PCIe use of the stack, with variance
    minimal: true
    minimal_hours: 2.5
    minimal_note: workload main.yaml without the long-context scenario and the nsys capture

  - id: E9
    title: Upstream all-in-VRAM reference on 2x B300 (original checkpoint)
    gpu: 2x-b300
    hours: 2.5
    command: make bench-E9
    data: data/controlled/E9-reference-b300/
    runs:
      - {variant: upstream, model: original, workload: experiments/workloads/main.yaml}
    answers: the speed of the same model without quantization or offload, on hardware where it fits
    minimal: true
    minimal_hours: 1.5
    minimal_note: scenarios A and P, N in {1, 8, 32}, 3 repetitions

  - id: E10
    title: Quality of the EXL3 stack (lm-evaluation-harness, pinned)
    gpu: 2x-rtx-pro-6000
    hours: 3.0
    command: make quality-E10
    data: data/controlled/E10-quality-exl3/
    answers: accuracy on GSM8K, MATH-500, HumanEval, MBPP, IFEval, RULER subsets
    minimal: true
    minimal_hours: 1.5
    minimal_note: GSM8K, IFEval, HumanEval only

  - id: E11
    title: Quality of the reference (original checkpoint, upstream vLLM, 2x B300)
    gpu: 2x-b300
    hours: 2.0
    command: make quality-E11
    data: data/controlled/E11-quality-reference/
    answers: the baseline for E10 under identical prompts, seeds and sampling
    minimal: true
    minimal_hours: 1.0
    minimal_note: GSM8K, IFEval, HumanEval only
    readme_note: |
      Lean plan: the reference is the official DeepSeek API (`deepseek-flash`, served by DeepSeek-V4.1-Flash), run through
      `quality/api_proxy.py` with the fixed-seed subsets; results go to `api/<run_id>/` with `api_usage.jsonl` (real token
      counts for the cost).

  - id: E12
    title: Long context at 128K and 256K tokens (prefill, decode and cached shared prefix)
    table_title: "Long context at 128K and 256K tokens as run (pod 2; prefill, decode and cached shared prefix, one repetition)"
    gpu: 2x-rtx-pro-6000
    hours: 0.75
    command: "POD_CREATED_EPOCH=<create time> bash experiments/runs/long.sh"
    data: data/controlled/E12-long-context/
    runs:
      - {variant: exl3-offload, plan: gen30, spec: dspark, workload: experiments/workloads/long_context.yaml}
    answers: whether the E8 rates hold when prompts approach the 262,144-token context, and how many such requests the recipe's KV cache admits
    minimal: false

  - id: E13
    title: Interactive coding-agent workload (streams at 40 output tokens/s per stream, by context-sharing regime)
    gpu: 2x-rtx-pro-6000
    hours: 1.1
    command: "POD_CREATED_EPOCH=<create time> bash experiments/runs/agent.sh"
    data: data/controlled/E13-coding-agent/
    runs:
      - {variant: exl3-offload, plan: gen30, spec: dspark, workload: experiments/workloads/agent.yaml}
    answers: how many streams generate at the same time with a median of at least 40 output tokens/s each, for short, shared-cached, independent long and agent-turn contexts
    minimal: false

# ---------------------------------------------------------------------------------------------------------------------
# LEAN PLAN (recommended, 2026-10-06): the owner rejected the full and minimal budgets, and then asked for a single pod
# session of at most two hours. One 2x RTX PRO 6000 pod, steps in priority order, resumable, budget-checked before each
# step (experiments/runs/lean.sh). The core steps plus the contingency fit in the two hours; the stretch step runs only
# if time is left. The full and minimal plans above are kept for reference. Minutes are estimates; each states its basis.
lean:
  recommended: true
  pod: 2x-rtx-pro-6000
  command: "POD_CREATED_EPOCH=<create time> bash experiments/runs/lean.sh"
  target_minutes: 120       # the owner's limit: two hours of pod time
  hard_cap_usd: 8.36        # 120 min at 4.18 USD/h; experiments/pod/watchdog.sh <pod> 7200
  soft_cap_usd: 8.15        # 117 min: lean.sh starts no step that would end above this (copy-back reserve 5 min)
  contingency: 0.20
  steps:
    - id: L0
      title: Pod create, sshd, clone, stack fetch, build exl3-min, 309 GiB EXL3 download in parallel
      minutes: 17
      basis: "exploratory sweep: pod created 11:02:44, server ready 11:19:08 (16.4 min incl. 214 s bootstrap, 99 s download, 3.6 min boot)"
      priority: core
    - id: L1
      title: "E2 feasibility: exl3-min all-in-VRAM (expected to fail) and exl3-offload with an empty plan (expected to fail)"
      minutes: 8
      basis: "hard cap: boot timeouts 3 + 3 min, 2 min to switch the plugin build; no original checkpoint is downloaded"
      priority: core
    - id: L2
      title: "E8 main: gen30, scenarios A and B at N = 1, 2, 4, 8, 16, 32, 64, 2 repetitions; prefill and decode probes; E3 gen30 point on the same boot"
      minutes: 38
      basis: "warm boot 4 min (exploratory relaunch 3 min 35 s); A took about 6 min and B about 4 min of measurement in the exploratory sweep, budgeted 12 min per repetition for both (24); probes 5; E3 subset 5"
      priority: core
    - id: L3
      title: "E10 quality reduced: fixed-seed subsets GSM8K 150, IFEval 150, HumanEval 164 (quality/subsets_lean2h_seed20261006.json), greedy, thinking off"
      minutes: 20
      basis: "4 min boot, lm-eval capped at 15 min (about 0.14M output tokens at the exploratory N = 32 aggregate rate of about 200 tok/s is about 12 min), 1 min margin"
      priority: core
    - id: L4
      title: "E3 reduced: host share gen30 (in L2) vs upstream vLLM UVA offload of the EXL3 experts at the gen30 host bytes; 1 repetition at N in {1, 8, 32}"
      minutes: 10
      basis: "1 min plugin rebuild, 4 min boot, 5 min subset; the UVA boot may fail quickly, which is a result"
      priority: core
    - id: L5
      title: Copy results back with sha256 on both ends, delete the pod
      minutes: 5
      basis: "reserve kept by lean.sh"
      priority: core
    - id: S1
      title: "Stretch: a second host share, gen30 union agent30 (43.5% of target experts), 1 repetition at N in {1, 8, 32}"
      minutes: 10
      basis: "1 min plugin rebuild, 4 min boot, 5 min subset"
      priority: stretch
  api_reference:
    id: E11-api
    title: "Quality reference: official DeepSeek API, model deepseek-flash (DeepSeek-V4.1-Flash), same subsets"
    command: "DEEPSEEK_API_KEY=... python3 quality/api_proxy.py --usage <run_dir>/api_usage.jsonl & CHAT_URL=http://127.0.0.1:8100/v1/chat/completions MODEL_NAME=deepseek-flash SAMPLES=quality/subsets_lean2h_seed20261006.json bash quality/run_lm_eval.sh <run_dir>"
    data: data/controlled/E11-quality-reference/api/
    price: {file: experiments/pricing.yaml, key: deepseek-flash}
    # token counts are ESTIMATES (per item); the proxy logs the real usage and the cost is recomputed from it
    tokens_per_item:
      gsm8k_cot_llama: {items: 150, input: 1000, output: 200}
      ifeval: {items: 150, input: 120, output: 400}
      humaneval_instruct: {items: 164, input: 250, output: 300}
    caveat: "the API's serving precision, system prompt and sampling implementation cannot be verified; reported separately, never pooled with pod data"
  not_answered:
    - "speed of the unquantized model fully in VRAM (E9 dropped: no 2x B300 pod); future work"
    - "upstream vLLM with the original checkpoint on the RTX PRO 6000 pair, with or without UVA (E2 rungs dropped to save the 475 GiB download)"
    - "quality reference on our own hardware with identical serving code (E11 on 2x B300 dropped); the API stands in"
    - "the host-share slope unless stretch S1 runs (only gen30 is core); routing-count plans at several shares (E3 profile step dropped)"
    - "placement policy (E4), Engram format (E5), SM budget (E6), DSpark off (E7), prose scenario P, long context L, Poisson arrivals, MATH, MBPP, RULER, LongBench"
    - "across-boot variance (one boot per configuration); two repetitions for E8 and one per E3 point"
