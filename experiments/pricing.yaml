api:
  deepseek-flash:
    model_served: DeepSeek-V4.1-Flash (the pricing page says requests to deepseek-flash are served by DeepSeek-V4.1-Flash)
    source: https://api-docs.deepseek.com/quick_start/pricing
    fetched: "2026-10-06"
    file: data/static/pricing/deepseek-api-pricing-2026-10-06.html
    thinking_toggle: '{"thinking": {"type": "disabled"}} (data/static/pricing/deepseek-api-thinking-mode-2026-10-06.html)'
    # USD per 1M tokens. Off-peak rates are half of peak; peak hours 01:00-04:00 and 06:00-10:00 UTC Mon-Fri.
    peak: {input_cache_hit: 0.006, input_cache_miss: 0.30, output: 1.20}
    off_peak: {input_cache_hit: 0.003, input_cache_miss: 0.15, output: 0.60}
