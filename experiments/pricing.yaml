# GPU pricing used by the cost model. Prices are per pod-hour for the whole pod (all its GPUs), USD.
# Sources: RunPod create responses (costPerHr) recorded in the exploratory logs, and the orchestrator's quotes
# for the planned runs (2026-10-06). Prices change; rerun the cost model with current prices before relying on it.
fx:
  # ECB euro foreign exchange reference rate, published for 2026-10-05, fetched 2026-10-06
  # (data/static/fx/ecb-eurofxref-daily-2026-10-05.xml). 1 EUR = usd_per_eur USD.
  usd_per_eur: 1.1204
  date: "2026-10-05"
  source: https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml
  file: data/static/fx/ecb-eurofxref-daily-2026-10-05.xml
configs:
  2x-rtx-pro-6000:
    gpus: 2
    gpu: NVIDIA RTX PRO 6000 Blackwell Server Edition (96 GB)
    usd_per_hour: 4.18
    provider: RunPod SECURE, EUR-IS-1
    source: "data/exploratory/inferencekey-deepseek@546071a/vllm-exl3/pro6000-concurrency/logs/create_loop.log"
    host_ram_gib_cgroup: 351.1
